# Serves the built Vite SPA. All non-asset paths fall back to index.html so client-side
# routing (react-router) works on deep links / refresh.
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API proxy (production-hardening 2B): forward /api/* to the api service, stripping
    # the /api prefix (the trailing slash on proxy_pass does that). Serving the SPA and the API from
    # one origin lets the HttpOnly, SameSite=Strict auth cookie ride along automatically — no CORS.
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
