# Self-host stack for the Form Platform (production-hardening 1C).
#   docker compose up --build
# Postgres + the NestJS API (auto-migrates on boot) + the Vite SPA served by nginx.
# Values below are non-secret local defaults; override per-host with a root `.env`
# (compose substitutes ${VAR:-default}). Real secrets/auth arrive in Phase 2.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formplatform}
      POSTGRES_DB: ${POSTGRES_DB:-formplatform}
    # Host port 5435 (5432/5433 are commonly taken by a local Postgres) so DataGrip can
    # still connect to the container DB.
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formplatform} -d ${POSTGRES_DB:-formplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local catch-all mailbox (A2): the API sends here and nothing leaves the host. Mailpit is the
  # maintained successor of MailHog — same ports (1025 smtp / 8025 web UI). Swap the image for
  # `mailhog/mailhog` if you prefer the original. Replace with a real relay in production.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-formplatform}:${POSTGRES_PASSWORD:-formplatform}@postgres:5432/${POSTGRES_DB:-formplatform}?schema=public
      PORT: 3001
      # Browser origins allowed by CORS (the builder below). Empty => no cross-origin requests.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Rate limiting (1D + P6). Listed explicitly because this service has no `env_file`: without
      # these lines the limits are not tunable in a compose deployment at all. The `/external/*`
      # budget is per API key — an integrating system calls from one egress IP.
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      EXTERNAL_THROTTLE_LIMIT: ${EXTERNAL_THROTTLE_LIMIT:-300}
      EXTERNAL_IP_THROTTLE_LIMIT: ${EXTERNAL_IP_THROTTLE_LIMIT:-600}
      # JWT signing secret (2A). The default is a dev-only placeholder — set a real
      # JWT_SECRET in a root .env for any deployment (boot fails fast if < 16 chars).
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Short access token + long rotating refresh token (A1).
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      # Set true behind HTTPS in production so the browser only sends the auth cookie over TLS (2B).
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Optional: seed an admin owning pre-2A data (id="local"). Leave unset to skip.
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      # Mail (A2): the local catch-all below. Point SMTP_HOST at a real relay for production —
      # unset it entirely and the API falls back to logging each email instead of sending.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Form Platform <no-reply@form-platform.local>}
      # Base of the verify/reset links we email — the URL the *browser* uses (the builder below).
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      # Google sign-in (A3) — optional. Unset => the feature is simply off (the route 404s and the
      # builder hides the button). The redirect URI defaults to APP_PUBLIC_URL +
      # /api/auth/oauth/google/callback, which nginx already proxies; only set GOOGLE_REDIRECT_URI
      # when the API lives on a different origin than the SPA.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      - "${API_PORT:-3001}:3001"
    # GET /health runs a `SELECT 1`, so green = process up AND database reachable (1D).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  builder:
    build:
      context: .
      dockerfile: apps/builder/Dockerfile
      args:
        # Same-origin by default (2B): the SPA calls /api/*, which nginx proxies to the api service
        # so the HttpOnly auth cookie rides along. Override only if the API is on another origin.
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      # Wait until the api is healthy so nginx can resolve the `api` upstream at startup.
      api:
        condition: service_healthy
    ports:
      - "${BUILDER_PORT:-8080}:80"

volumes:
  pgdata:
