# Knowledge Index — L2 freshness registry
#
# Nature: descriptive/reference (L2). This file is itself part of L2: it records,
# for every governed *descriptive* artifact, the freshness contract that keeps it
# from silently poisoning AI context (constitution §10, the framework's founding
# concern). It is generated from — and re-verified against — L0 (the repo), never
# from memory.
#
# SCOPE OF THIS INDEX (owner ruling, 2026-07-04): **L2 descriptive artifacts only.**
#   - Freshness contracts (scope · verified-on · method · cadence · class) are, per
#     constitution §10, a property of *descriptive* artifacts — facts about L0 that
#     can drift. Normative L1 artifacts (constitution, policies, ADRs) carry
#     status+version instead (§5) and are governed by the ADR ledger + lifecycle,
#     NOT by a freshness method — they have no executable "re-verify against L0"
#     check. Listing them here would mix natures (§5) and add bookkeeping with no
#     enforcement payoff (§14). So they are deliberately absent.
#   - Living *progress trackers* (evidence-nature: `docs/expansion/*.md`,
#     including `production-hardening.md`, `product-roadmap.md`, `ai-dev-framework.md`)
#     are also absent by design: their freshness is maintained by the per-phase
#     update discipline, not a freshness contract. See `unregistered_by_design`.
#
# FIELD SCHEMA (per entry):
#   id           stable slug (used by future gates / cross-refs)
#   path         repo-relative path to the artifact
#   nature       always `descriptive` in this index (§5)
#   class        evidence class of its verification (§7): E1 executed / E2 source-read
#   owner        who is accountable for re-verification (§3: agent+reviewer for L2)
#   verified_on  date the method last ran green against L0 (YYYY-MM-DD)
#   cadence      when to re-verify (the periodic + per-change triggers, §10)
#   scope        L0 path globs the artifact describes (the per-change trigger surface)
#   method       the EXECUTABLE check that re-verifies it (§10); commands + expected
#   claims       optional — the specific checkable figures the method asserts
#   notes        optional
#
# CONSUMED BY (future): the index/freshness CI gate (roadmap E6 T6.2.1, advisory-first)
# and the health signal "oldest past-due freshness contract" (constitution §13).

framework_version: 1
schema_version: 1
maintained_under: docs/expansion/ai-dev-framework.md   # E2 track (T2.1.1 created this)

artifacts:
  - id: system-overview
    path: docs/architecture/system-overview.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-03
    cadence: >-
      per-change when a package/app/module/model is added or removed or a major
      dependency is bumped; otherwise each release.
    scope:
      - packages/**
      - apps/**
      - apps/api/prisma/schema.prisma
      - apps/builder/src/main.tsx
      - "**/package.json"
      - docker-compose.yml
    method: |
      # Structural counts must match the figures stated in the doc.
      ls -d packages/*/                              | wc -l   # expect 10 packages
      ls -d apps/api/src/modules/*/                  | wc -l   # expect 14 modules
      ls apps/api/src/persistence/repositories/*.repo.ts | wc -l   # expect 17 repos
      grep -c '^model ' apps/api/prisma/schema.prisma          # expect 21 models
    claims:
      packages: 10
      api_modules: 14
      api_repos: 17
      prisma_models: 21
    notes: >-
      Full row-by-row verification was 2026-07-03 (E0 T0.3.1). Structural counts
      re-calibrated 2026-07-04 (E2 T2.1.1) — zero drift. Prose/endpoint/version
      claims are E2 and re-verify on cadence.

  - id: api-architecture
    path: apps/api/ARCHITECTURE.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-03
    cadence: >-
      per-change when an api module/repository is added or removed, an endpoint or
      the auth/tenancy/RBAC posture changes, or the DB engine changes; else each release.
    scope:
      - apps/api/src/**
      - apps/api/prisma/schema.prisma
    method: |
      ls -d apps/api/src/modules/*/                  | wc -l   # expect 14 modules
      ls apps/api/src/persistence/repositories/*.repo.ts | wc -l   # expect 17 repo interfaces
      ls apps/api/src/persistence/prisma/*.repo.ts   | wc -l   # expect 17 Prisma impls
      # DB engine (must read postgres, not sqlite)
      grep -i 'provider' apps/api/prisma/schema.prisma          # expect postgresql
    claims:
      api_modules: 14
      api_repos: 17
    notes: >-
      Repositories live under apps/api/src/persistence/ (abstract *Repo + prisma-*
      impl), NOT under src/modules/. Module/repo counts re-calibrated 2026-07-04.

  - id: builder-architecture
    path: apps/builder/ARCHITECTURE.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-03
    cadence: >-
      per-change when a builder feature folder is added or removed, or the
      fetch-only-in-client.ts convention changes; else each release.
    scope:
      - apps/builder/src/**
    method: |
      # The feature folders the doc documents must all still exist.
      for d in admin ai auth shell submissions versions editor workflow workspace query; do
        test -d apps/builder/src/$d && echo "ok $d" || echo "MISSING $d"
      done
      # fetch() must remain confined to the api clients (react-query convention). The two
      # sanctioned files are lib/apiFetch.ts and auth/client.ts — expect NO other hits.
      grep -rl 'fetch(' apps/builder/src --include=*.ts --include=*.tsx | grep -vE 'apiFetch\.ts|client\.ts'
    notes: >-
      Feature-folder presence re-calibrated 2026-07-04 — all present. fetch() is confined to
      the two api-client files lib/apiFetch.ts + auth/client.ts (the documented carve-out).
      DETECTOR FIX (E2 validation 2026-07-04): the earlier method excluded only apiFetch.ts and
      false-flagged auth/client.ts — corrected to exclude both client files.

  - id: usage-runbook
    path: docs/usage.md
    nature: descriptive
    class: E2
    owner: agent+reviewer
    verified_on: 2026-07-03
    cadence: >-
      per-change when env vars, dev/test/docker commands, ports, or the auth model
      change; else each release.
    scope:
      - apps/api/src/config/env.ts
      - apps/api/env.example
      - docker-compose.yml
      - package.json
      - apps/api/package.json
    method: |
      # Env vars documented in usage.md must match the source of truth.
      # Compare the doc's env table against the validated schema + authoritative template.
      cat apps/api/src/config/env.ts
      cat apps/api/env.example
    notes: >-
      Env vars were reconciled 2026-07-03 (E0 T0.2.3) against apps/api/src/config/env.ts
      and the authoritative env template (SQLite→PostgreSQL, real JWT+refresh auth). Scope
      corrected 2026-07-04: the authoritative template is apps/api/env.example (no dot); the
      dotted apps/api/.env.example is a stale SQLite-era duplicate, filed for disposal (see
      the runbook-dev-stack entry). Not re-diffed 2026-07-04 — carries the 2026-07-03 stamp.

  - id: agents-guide
    path: AGENTS.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-03
    cadence: per-change when a package is added/removed/renamed; else each release.
    scope:
      - packages/**
    method: |
      # AGENTS.md Layout names a curated subset of packages with roles; each must exist.
      for p in form-schema form-core form-renderer-web form-renderer-native \
               workflow-schema workflow-core; do
        test -d packages/$p && echo "ok $p" || echo "MISSING $p"
      done
    notes: >-
      Only AGENTS.md's *descriptive* surface (the Layout package roster + folder
      structure) is registered here. Its normative golden rules (contract-first,
      no-eval, additive schema, renderer peerDeps, native freeze) are governed at
      L1 by the constitution + ADR-0006/0014/0015/0016, and AGENTS.md becomes a
      pointer to them in E5 (T5.3.1). Registered scope re-verified 2026-07-04.

  - id: runbook-dev-stack
    path: knowledge/runbook/dev-stack.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-04
    cadence: per-change when a port, a run script, or the env contract changes; else each release.
    scope:
      - apps/api/src/config/env.ts
      - apps/api/env.example
      - docker-compose.yml
      - package.json
      - apps/api/package.json
    method: |
      # Ports / run scripts / env defaults the runbook states must match L0.
      grep -nE 'PORT|CORS_ORIGINS|JWT_SECRET' apps/api/src/config/env.ts   # 3001 default, 5173, >=16
      grep -nE 'POSTGRES_PORT:-5435|postgres:16' docker-compose.yml        # host 5435 -> container 5432
      node -e "console.log(require('./apps/api/package.json').scripts.dev)" # 'tsc && node dist/main.js'
    claims:
      api_port: 3001
      builder_port: 5173
      postgres_host_port: 5435
    notes: >-
      Consolidates dev-stack facts previously only in machine-local memory (dev-stack-ports)
      + docs/usage.md operational sections. Only gotchas seen >=2x are promoted (constitution
      §8 climb-on-evidence). First L2 runbook.

  - id: registry-model
    path: knowledge/registries/model-registry.yaml
    nature: descriptive
    class: E2
    owner: agent+reviewer
    verified_on: 2026-07-04
    cadence: >-
      re-verify when a new model family ships (calibration gate) or the agent roster / model
      policy changes; else on framework-version bump.
    scope:
      - .claude/agents/explorer.md
      - .claude/agents/reviewer.md
      - decision-records/ADR-0011-model-cost-policy.md
    method: |
      # Roster must match L0 agent files (the model IDs themselves are E4/external — harness
      # environment + the claude-api skill — and re-verify at-read when models ship).
      grep -h '^model:' .claude/agents/explorer.md .claude/agents/reviewer.md   # haiku, opus
      # Escalation policy must still match ADR-0011 + the tracker's endorsed model policy.
      grep -l 'Fable 5' decision-records/ADR-0011-model-cost-policy.md   # authority still names the escalation
      grep -c 'Opus 4.8' docs/expansion/ai-dev-framework.md             # tracker still carries the model policy
    notes: >-
      Reference materialization of the model policy — the NORMATIVE authority is ADR-0011 +
      the tracker's endorsed policy; this registry does not re-decide it (§5: registry =
      descriptive reference, policy = normative elsewhere).

  - id: registry-gate-inventory
    path: knowledge/registries/gate-inventory.yaml
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-12
    cadence: re-verify when a CI workflow, a hook, or a permission deny rule changes; else each release.
    scope:
      - .github/workflows/**
      - .claude/settings.json
      - apps/builder/src/structure.test.ts
    method: |
      # Every catalogued gate must still exist in L0.
      ls .github/workflows/                                              # ci, codeql, gitleaks, sonarcloud, trivy
      node -e "const s=require('./.claude/settings.json'); console.log('deny:',s.permissions.deny.join(',')); console.log('hooks:',Object.keys(s.hooks||{}).join(','))"
      test -f apps/builder/src/structure.test.ts && echo "structure test present"
    notes: >-
      Authority for the rung labels is constitution §8. Nearly all gates sit at rung 3 (CI) —
      this repo already hardened its core checks. ci-sonarcloud is advisory (no-ops until
      SONAR_TOKEN is set). Feeds the E6 gate-promotion work.

  - id: standard-coding
    path: knowledge/standards/coding-standard.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-04
    cadence: >-
      re-verify when the api persistence layering, the builder feature-folder rule, or an
      anchoring ADR (0006/0014/0015/0016/0019/0023) changes; else each release.
    scope:
      - apps/api/src/**
      - apps/builder/src/**
      - tsconfig.base.json
      - packages/form-renderer-web/package.json
    method: |
      # Sweep 1 — Prisma access confined to persistence/prisma + the two carve-outs
      # (modules/health liveness ping, scripts one-off import). Match the this.prisma.
      # ACCESS signal, NOT PrismaService imports (those false-flag DI wiring + a doc comment).
      grep -rlnE "this\.prisma\." apps/api/src --include=*.ts \
        | grep -vE 'persistence/prisma/|modules/health/|scripts/'    # expect EMPTY (clean)
      # Sweep 2 — builder feature-folder guardrail (no stray root *.tsx beyond App/main).
      (cd apps/builder && npx vitest run src/structure.test.ts)      # expect pass
    notes: >-
      Descriptive extraction of the coding conventions (constitution §2/§3 place extracted
      standards in L2). The golden rules' normative force lives at L1 (constitution +
      ADR-0006/0014/0015/0016/0019/0023); this standard points to them and does not
      re-decide. Method = the two owed conformance sweeps; fetch()-confinement + the
      feature-folder folder roster are covered by the builder-architecture entry (one home
      per method). Both sweeps ran clean 2026-07-04; Sweep 1 was calibrated this pass (the
      PrismaService-import signal false-flagged health.module.ts's doc comment).

  - id: standard-verification
    path: knowledge/standards/verification-standard.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-04
    cadence: re-verify when the verify-bar scripts or the CI verify job change; else each release.
    scope:
      - package.json
      - .github/workflows/ci.yml
    method: |
      # The verify-bar scripts must still exist at the repo root.
      node -e "const s=require('./package.json').scripts; for (const k of ['typecheck','test','build','changeset']) if(!s[k]) throw new Error('missing '+k); console.log('bar ok')"  # expect: bar ok
      # CI must still run the bar (typecheck + build + test).
      grep -nE 'run typecheck|run build|run test' .github/workflows/ci.yml    # expect all three
    notes: >-
      Descriptive operational layer over the L1 verification policy (governance/policies/
      verification.md), which owns the normative floors + 5-rule loop (pointed to, not
      restated). Adds the concrete verify bar (extracted from package.json/CI) and the
      codified manual MCP browser-smoke protocol; smoke bring-up/gotchas defer to
      runbook-dev-stack (one home). Automated e2e (Playwright) is out of scope — gated by
      ADR-0008 / epic E7.

  - id: standard-documentation
    path: knowledge/standards/documentation-standard.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-04
    cadence: >-
      re-verify when the constitution's nature/freshness sections or ADR-0003 change; else
      each release.
    scope:
      - governance/constitution.md
      - decision-records/ADR-0003-working-language.md
      - knowledge/index.yaml
    method: |
      # Conformance: every index-registered descriptive artifact must carry a freshness
      # header (the §10 fields — a nature/verified-on declaration). Expect all "ok".
      node -e "const p=require('path'); const cp=require('child_process'); const fs=require('fs'); \
        const dir=cp.execSync('ls -d node_modules/.pnpm/yaml@*/node_modules/yaml',{encoding:'utf8'}).trim(); \
        const YAML=require(p.resolve(dir)); \
        const d=YAML.parse(fs.readFileSync('knowledge/index.yaml','utf8')); \
        for (const a of d.artifacts){const t=fs.readFileSync(a.path,'utf8'); \
          console.log((/[Ff]reshness contract|verified[-_ ]on/i.test(t)?'ok  ':'MISS ')+a.path);}"
    notes: >-
      Meta-standard: describes how docs are written/kept-fresh/languaged. Normative sources
      are pointed to, not restated — natures/lifecycle in constitution §5/§6, freshness in
      §10, working language in ADR-0003 (Accepted, Option A). Method is a conformance sweep
      over the index itself (all registered descriptive docs carry a freshness header); ran
      clean 2026-07-04 (10/10 ok).

  - id: standard-release-readiness
    path: knowledge/standards/release-readiness-standard.md
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-05
    cadence: >-
      re-verify when release.yml appears, the changeset config changes, or a package is first
      published — AND graduate the standard (thin -> full) at the first real release; else each release.
    scope:
      - .github/workflows/
      - .changeset/
      - packages/*/package.json
    method: |
      # The thin gate's grounding facts must still hold. If release.yml appears OR any package
      # leaves 0.x / publishes, the standard is stale and must graduate (ADR-0005 Option C).
      ls .github/workflows/release.yml 2>/dev/null && echo "GRADUATE: release.yml exists" || echo "ok: no release pipeline yet"
      node -e "const fs=require('fs'); const ps=fs.readdirSync('packages'); let pub=0; for(const p of ps){try{const j=require('./packages/'+p+'/package.json'); if(!j.private) pub++;}catch(e){}} console.log('publishable packages:',pub,'(all still 0.x — none published)')"
    notes: >-
      Thin release-readiness gate (ADR-0005 Accepted, Option C): composes existing exercised gates
      (verify bar / CI / changeset / reviewer / live-smoke) and points to their homes
      (dor-dod, verification-standard, gate-inventory); originates no rule. Full release governance
      is deferred to the first real release. Blockers live in registry-release-blockers.

  - id: registry-release-blockers
    path: knowledge/registries/release-blockers.yaml
    nature: descriptive
    class: E1
    owner: agent+reviewer
    verified_on: 2026-07-05
    cadence: >-
      volatile — re-verify whenever a release-relevant fact moves (changeset added/removed, a
      commit is made or the branch is pushed, release.yml appears, a package publishes).
    scope:
      - .changeset/
      - .github/workflows/
      - packages/*/package.json
    method: |
      # Re-measure the three present blockers (counts are volatile).
      ls .changeset/*.md | grep -v README | wc -l            # changeset-backlog (was 94)
      ls .github/workflows/release.yml 2>/dev/null || echo "no-publish-pipeline: release.yml ABSENT"
      git log --oneline origin/main..HEAD | wc -l            # unpushed-branch-exposure (was 47; resets on push)
    claims:
      changeset_backlog: 94
      unpushed_commits: 47
      publishable_packages_unpublished: 10
    notes: >-
      Owner-visible register of present release blockers + the 3 parked ADR-0005 open questions
      (backlog strategy / npm-vs-deploy / push-cadence). Reference materialization; authority is
      ADR-0005. Figures are volatile by nature — verified_on marks the last measurement, not a
      stable fact. Pairs with standard-release-readiness (thin gate).

# Descriptive docs deliberately NOT registered (kept here for traceability so the
# omission is auditable, not accidental):
unregistered_by_design:
  - path: docs/expansion/production-hardening.md
    reason: >-
      Living progress tracker (evidence-nature). Its factual claims were remediated
      in E0 T0.2.3, but a phase tracker is kept fresh by the per-phase update
      discipline, not a freshness contract with an executable re-verify method;
      registering it would mix natures (§5). FINDING (filed, not fixed per §10):
      its Mục tiêu preamble states "11 packages" — current truth is 10 (E1,
      2026-07-04). Low-severity stale figure; remediate as its own task if desired.
  - path: docs/expansion/product-roadmap.md
    reason: Living progress tracker (evidence-nature); same rationale as above.
  - path: docs/expansion/ai-dev-framework.md
    reason: This framework's own progress tracker (evidence-nature); same rationale.
