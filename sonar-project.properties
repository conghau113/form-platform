# SonarCloud project config. Replace the two placeholders below with the values from
# your SonarCloud project (Administration → Update Key / organization key), then add the
# SONAR_TOKEN secret. See .github/workflows/sonarcloud.yml for the full setup steps.
sonar.organization=conghau113
sonar.projectKey=conghau113_form-platform

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/dist/**,**/node_modules/**,**/.turbo/**,**/*.test.ts,**/*.test.tsx,**/prisma/migrations/**

# Optional: wire up coverage once a coverage reporter is configured in Vitest.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
